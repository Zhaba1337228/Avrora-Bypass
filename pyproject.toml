[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-typing-studio"
version = "0.1.0"
description = "A local desktop utility for paced, character-by-character text entry."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pynput>=1.7.6,<2.0"]

[project.optional-dependencies]
build = ["pyinstaller>=6.0,<7.0"]

[project.scripts]
code-typing-studio = "code_typing_utility.ui.app:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
